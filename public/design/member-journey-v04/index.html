}
.transition-shadow {
  transition-property: box-shadow;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-transform {
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.duration-200 {
  transition-duration: 200ms;
}
.duration-300 {
  transition-duration: 300ms;
}

/* ================================================================
   آرش صفری · تحلیلگر و مشاور سرمایه‌گذاری
   Brand Foundation v3.0 — Light Theme First, Dark Toggle Capable
   ================================================================ */

:root {
  /* ─── Brand palette (canonical) ─────────────────────────── */
  --navy:        #1E3A8A;   /* primary brand */
  --navy-deep:   #0D1F4A;   /* deep institutional navy (brand book) */
  --navy-soft:   #2748A6;   /* hover / interactive */
  --gold:        #B8860B;   /* primary gold accent */
  --gold-soft:   #D4A22B;   /* gold on dark / hover */
  --gold-light:  #F5D07A;   /* bright gold on navy (brand book) */
  --gold-tint:   #F5E6B8;   /* gold background tint */

  /* ─── Surface system (light theme — warm brand palette) ─── */
  --bg:          #F8F7F4;   /* page background — warm off-white */
  --surface:     #FFFFFF;   /* card surface */
  --surface-2:   #F2F0E8;   /* subtle surface — brand cream */
  --cream:       #F2F0E8;   /* brand cream (breathing space) */
  --line:        #E5E3DC;   /* borders / dividers — warm */
  --line-strong: #D6D2C6;   /* emphasized borders — warm */
  --nav-bg:      rgba(248,247,244,0.85);  /* sticky navbar (theme-aware) */

  /* ─── Text scale ────────────────────────────────────────── */
  --text:        #0F172A;   /* primary text — institutional dark */
  --text-2:      #334155;   /* secondary text */
  /* ۴٫۱۷:۱ روی `--surface-2` بود — زیرِ AA برای متنِ کوچک، و همهٔ فراداده‌ها
     (تاریخ، پوشش، زیرنویسِ کارت) از همین توکن می‌آیند. حالا ۵٫۴:۱. */
  --text-3:      #556274;   /* muted / metadata */
  --text-on-navy:#F8FAFC;   /* text on navy surface */
  --text-on-gold:#172554;   /* text on gold surface */
  /* عنوان‌ها: در تمِ روشن سرمه‌ایِ برند، در تمِ تیره روشن.
     `--navy-deep` یک رنگِ **برند** است و در `.dark` عوض نمی‌شود (چون پس‌زمینهٔ
     هیرو هم هست)، پس استفاده از آن به‌عنوان رنگِ متن، عنوان‌ها را در تمِ تیره
     ناخوانا می‌کرد. این توکن همان نقش را دارد ولی با تم می‌چرخد. */
  --heading:     #0D1F4A;
  /* طلاییِ متن روی سطحِ روشن: `--gold` (#B8860B) روی کرمِ برند فقط ۲٫۸۵:۱
     می‌دهد و برای متنِ ریز مردود است. این تُنِ تیره‌تر ۵٫۶:۱ می‌دهد و همان
     شخصیتِ طلایی را نگه می‌دارد. روی تمِ تیره به طلاییِ روشن می‌چرخد. */
  --gold-ink:    #7A5A08;
  --gold-on-tint: #7A5A08;
  --danger-ink: #B91C1C;
  /* رنگِ «متنِ فعال/لینک» روی سطح. در روشن همان سرمه‌ای برند است؛ در تیره
     روشن‌تر می‌شود چون سرمه‌ای روی زمینهٔ تیره نسبتِ ۱٫۶:۱ می‌دهد و عملاً
     ناخواناست. برای **پس‌زمینه** همچنان `--navy` به‌کار می‌رود، نه این. */
  --navy-ink:    var(--navy);

  /* ─── Semantic ──────────────────────────────────────────── */
  /* ۴٫۴۰:۱ روی `--surface-2` بود — زیرِ AA، در حالی که `--danger` همان‌جا
     ۵٫۶۷:۱ می‌داد. یعنی سبز و قرمزِ یک صفحه دو سطحِ خوانایی داشتند. حالا
     ۵٫۴۰:۱ و هم‌تراز با قرمز. */
  --success:     #157038;
  --warning:     #B45309;
  /* نسخهٔ جوهریِ هشدار — برای **متن** روی سطحِ کم‌رنگ. `--warning` خودش روی
     کاشیِ ۱۰٪-تینتِ همان رنگ ۴٫۳۸:۱ می‌دهد (زیرِ AA برای متنِ ۱۰٫۵ پیکسلی)؛
     این ۵٫۶:۱. `--warning` برای نوار و آیکون سرِ جایش می‌ماند. */
  --warning-ink: #9A4708;
  --danger:      #B91C1C;
  --info:        var(--navy);
  /* متنِ روی سطحِ «خطر». در تمِ تیره خودِ `--danger` روشن می‌شود، پس سفید
     روی آن ۳٫۰۱:۱ می‌دهد — زیرِ AA. این توکن با تم می‌چرخد. */
  --text-on-danger: #FFFFFF;

  /* ─── حلقهٔ فوکوس ────────────────────────────────────────────
     تا امروز فوکوس فقط `--ring` بود: یک هالهٔ سرمه‌ایِ ۱۸٪. در تمِ **تیره**
     این توکن اصلاً بازتعریف نمی‌شد، یعنی هالهٔ سرمه‌ای روی زمینهٔ سرمه‌ایِ
     تیره تقریباً نامرئی بود و کاربرِ کیبورد نمی‌دانست کجاست. حالا رنگِ فوکوس
     خودش توکن است و با تم می‌چرخد. */
  --focus:       var(--navy);
  --ring:        0 0 0 3px rgba(30,58,138,0.28);

  /* ─── پالتِ داده (نمودار) ────────────────────────────────────
     شش رنگِ **دسته‌ای** برای سری‌های نمودار، ساخته‌شده از خانوادهٔ برند
     (سرمه‌ای و طلایی) به‌علاوهٔ چهار تُنِ خاموشِ هم‌خانواده. هر شش رنگ روی
     `--surface`، `--bg` و `--surface-2` بالای ۵:۱ می‌دهند، پس هم برای سطح و
     هم برای خطِ نازک و برچسبِ ریز کافی‌اند.

     اینها جایگزینِ `--success`/`--danger` **نیستند**: آن دو معنا دارند
     (صعود/نزول) و این شش فقط «دستهٔ متفاوت» را می‌گویند. */
  --data-1: #1E3A8A;
  --data-2: #7A5A08;
  --data-3: #0F6E6E;
  --data-4: #7C3A6B;
  --data-5: #3F6B35;
  --data-6: #A14A1F;
  /* خطوطِ راهنما عمداً کم‌کنتراست‌اند (~۱٫۲:۱) تا با خودِ داده رقابت نکنند؛
     محورها متن‌اند و کنتراستِ متن می‌خواهند. */
  --grid:   #EDEBE3;
  --axis:   var(--text-3);

  /* برقِ داخلیِ دکمه‌های پُر — عمق بدونِ سایهٔ سنگین. */
  --sheen:  rgba(255,255,255,0.14);

  /* ─── Social platform accents (توکنِ متمرکزِ برندِ شبکه‌ها) ──
     فقط برای آیکون/هالهٔ ظریفِ کارت‌های هابِ محتوا؛ بدنهٔ کارت هم‌چنان
     با توکن‌های برند. tint‌ها نیمه‌شفاف‌اند تا روی هر دو تم بنشینند. */
  --brand-telegram:       #229ED9;
  --brand-telegram-tint:  rgba(34,158,217,0.10);
  --brand-instagram-a:    #F58529;
  --brand-instagram-b:    #DD2A7B;
  --brand-instagram-c:    #8134AF;
  --brand-instagram-tint: rgba(221,42,123,0.09);
  --brand-x:              #0F1419;
  --brand-x-tint:         rgba(15,20,25,0.07);

  /* ─── Elevation (institutional, not glow) ───────────────── */
  --shadow-sm:   0 1px 2px 0 rgba(15,23,42,0.05);
  --shadow:      0 4px 12px -2px rgba(15,23,42,0.08), 0 2px 4px -1px rgba(15,23,42,0.04);
  --shadow-lg:   0 12px 28px -8px rgba(23,37,84,0.18), 0 4px 8px -2px rgba(15,23,42,0.06);
  /* `--ring` در بلوکِ فوکوسِ بالا تعریف می‌شود؛ تعریفِ دومی که اینجا بود
     مقدارِ تازه را بازمی‌نوشت (۱۸٪ به‌جای ۲۸٪) — خطای ترتیبِ کاسکید. */

  /* ─── Radius ────────────────────────────────────────────── */
  --r-sm: 6px;
  --r:    10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* ─── Type stack ────────────────────────────────────────── */
  --font-display: var(--font-pelak), "Vazirmatn", "IRANSansX", "Tahoma", sans-serif;
  --font-body:    var(--font-vazirmatn), "IRANSansX", "Pelak", "Tahoma", sans-serif;
}

/* ─── Dark mode overrides (toggled via .dark on <html>) ────── */
.dark {
  --bg:          #0B1220;
  --surface:     #131C30;
  --surface-2:   #1A2540;
  --line:        #1E2A47;
  --line-strong: #2C3B5E;
  --nav-bg:      rgba(11,18,32,0.85);

  --text:        #F1F5F9;
  --text-2:      #CBD5E1;
  --text-3:      #94A3B8;
  --heading:     #F1F5F9;
  --gold-ink:    var(--gold-light);
  --danger-ink: #FCA5A5;
  --navy-ink:    #93B4FF;   /* ۸٫۳:۱ روی --surface */

  /* ── رنگ‌های معنایی در حالتِ تیره ──────────────────────────────────────
     تا امروز `--success`/`--danger`/`--warning` در `.dark` بازتعریف **نمی‌شدند**
     و همان مقادیرِ روشن روی زمینهٔ تیره می‌نشستند: ۳٫۳۹:۱ برای سبز و ۲٫۶۲:۱
     برای قرمز — یعنی هر درصدِ تغییر، هر فلشِ صعود/نزول و هر نوارِ مثبت/منفی
     در تمِ تیره زیرِ حدِ AA بود. این‌ها نسخهٔ روشن‌ترِ همان رنگ‌اند (نه رنگِ
     تازه) و هر سه روی `--bg`، `--surface` و `--surface-2` بالای ۵:۱ می‌دهند. */
  --warning-ink: var(--warning);  /* در تمِ تیره خودِ توکن روشن است و کافی */
  --success:     #5EC98A;   /* ۸٫۲:۱ روی --surface */
  --danger:      #EF6B6B;   /* ۵٫۷:۱ روی --surface */
  --warning:     #E8B33C;   /* ۸٫۹:۱ روی --surface */

  --text-on-danger: #3B0A0A;   /* ۵٫۶۶:۱ روی --danger تیره */

  --focus:       var(--navy-ink);            /* ۷٫۴–۹٫۱:۱ روی سه سطحِ تیره */
  --ring:        0 0 0 3px rgba(147,180,255,0.35);

  /* پالتِ داده در تمِ تیره — همان شش هویت، روشن‌شده. کمینهٔ کنتراست ۷٫۴:۱. */
  --data-1: #93B4FF;
  --data-2: #F5D07A;
  --data-3: #5FD4D4;
  --data-4: #E7A3D6;
  --data-5: #A7DB92;
  --data-6: #F5A97A;
  --grid:   #22304F;
  --sheen:  rgba(255,255,255,0.07);

  --shadow-sm:   0 1px 2px 0 rgba(0,0,0,0.4);
  --shadow:      0 6px 16px -4px rgba(0,0,0,0.5), 0 2px 4px -1px rgba(0,0,0,0.3);
  --shadow-lg:   0 16px 36px -10px rgba(0,0,0,0.6);

  /* X روی تمِ تیره باید روشن دیده شود */
  --brand-x:              #E7E9EA;
  --brand-x-tint:         rgba(231,233,234,0.10);
}

/* ─── Reset & base ──────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  transition: background-color 0.25s ease, color 0.25s ease;
}

body { min-height: 100vh; }

/* سفیدِ قبلی روی `--gold` فقط ۳٫۲۵:۱ می‌داد — متنِ انتخاب‌شده کم‌خوان‌تر از
   متنِ انتخاب‌نشده بود. `--text-on-gold` همان جفتِ تعریف‌شدهٔ برند است: ۴٫۵۲:۱.
   (و hexِ خام هم از فایل بیرون رفت.) */
::-moz-selection { background: var(--gold); color: var(--text-on-gold); }
::selection { background: var(--gold); color: var(--text-on-gold); }

/* ─── Typography helpers ────────────────────────────────────── */
.font-display { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.01em; }
.font-body    { font-family: var(--font-body); }

/* ─── Buttons (institutional) ───────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 1.5rem;
  min-height: 44px; /* WCAG touch target */
  border-radius: var(--r);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 0.875rem;
  line-height: 1;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.06s ease;
  white-space: nowrap;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
}
/*
 * فوکوس با `outline` و نه `box-shadow`.
 *
 * ── چرا عوض شد ───────────────────────────────────────────────────────────
 * ۱) `box-shadow` همان خاصیتی است که خودِ دکمه برای «برجستگی در hover» به‌کار
 *    می‌برد، و `:active` آن را `none` می‌کرد — یعنی کاربری که با کیبورد روی
 *    دکمه بود، درست در لحظهٔ فشردن حلقهٔ فوکوسش ناپدید می‌شد.
 * ۲) در حالتِ «کنتراستِ اجباری» (Windows High Contrast) سایه حذف می‌شود ولی
 *    outline می‌ماند.
 * ۳) رنگش حالا توکن است و با تم می‌چرخد؛ نسخهٔ قبل در تمِ تیره نامرئی بود.
 */
.btn:focus-visible,
.input:focus-visible,
a:focus-visible,
[role="button"]:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
/* `opacity` به‌تنهایی «غیرفعال» را نمی‌گوید — نشانگر و معنا هم لازم است. */
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }

/* برقِ داخلیِ یک‌پیکسلی فقط روی دکمه‌های پُر — عمق بدونِ سایهٔ سنگین. */
.btn-primary, .btn-gold, .btn-danger { box-shadow: inset 0 1px 0 var(--sheen); }

.btn-primary { background: var(--navy); color: var(--text-on-navy); border-color: var(--navy); }
.btn-primary:hover:not(:disabled) { background: var(--navy-deep); border-color: var(--navy-deep); }

.btn-gold { background: var(--gold); color: var(--text-on-gold); border-color: var(--gold); }
.btn-gold:hover:not(:disabled) { background: var(--gold-soft); border-color: var(--gold-soft); }

/* کنشِ مخرب — رنگِ معناییِ جدا و فاصلهٔ بصری از کنشِ اصلی (HIG/MD). */
.btn-danger { background: var(--danger); color: var(--text-on-danger); border-color: var(--danger); }
.btn-danger:hover:not(:disabled) { filter: brightness(0.94); }

.btn-outline { background: transparent; color: var(--navy); border-color: var(--line-strong); }
.dark .btn-outline { color: var(--gold-soft); }
/* `--navy` روی سطحِ تیره ۱٫۶:۱ می‌دهد؛ `--focus` با تم می‌چرخد. */
.btn-outline:hover:not(:disabled) { border-color: var(--focus); background: var(--surface-2); }

.btn-ghost { background: transparent; color: var(--text-2); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

/* Outline button placed on a dark navy band (Hero / final CTA) */
.btn-on-navy { background: transparent; color: var(--gold-light); border-color: rgba(255,255,255,0.22); }
.btn-on-navy:hover:not(:disabled) { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.42); color: var(--gold-light); }
/* روی نوارِ سرمه‌ای، حلقهٔ سرمه‌ای دیده نمی‌شود. */
.btn-on-navy:focus-visible { outline-color: var(--gold-light); }

/* Primary CTAs get a subtle lift + elevation on hover (state clarity, on-brand) */
.btn-gold:hover:not(:disabled) { transform: translateY(-1px); box-shadow: inset 0 1px 0 var(--sheen), 0 8px 20px -8px rgba(184,134,11,0.55); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: inset 0 1px 0 var(--sheen), var(--shadow); }
.btn-danger:hover:not(:disabled) { transform: translateY(-1px); box-shadow: inset 0 1px 0 var(--sheen), var(--shadow); }
.btn-gold:active:not(:disabled), .btn-primary:active:not(:disabled), .btn-danger:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: inset 0 1px 0 var(--sheen);
}

/*
 * اندازه‌ها. هر دو هنوز ۴۴ پیکسل ارتفاعِ هدفِ لمسی دارند — `.btn-sm` فقط
 * padding و اندازهٔ متن را کم می‌کند، نه هدفِ انگشت را. دکمهٔ ۳۶ پیکسلی
 * «جمع‌وجورتر» نیست، خطاست.
 */
.btn-sm { padding: 0.5rem 0.9rem; font-size: 0.8rem; border-radius: var(--r-sm); }
.btn-lg { padding: 0.95rem 2rem; min-height: 52px; font-size: 0.95rem; border-radius: var(--r-lg); }

/* ─── Cards & surfaces ──────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card-elevated {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}

/* ─── Inputs ────────────────────────────────────────────────── */
.input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 0.75rem 1rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--text);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input::-moz-placeholder { color: var(--text-3); }
.input::placeholder { color: var(--text-3); }
/* `--navy` روی سطحِ تیره ۱٫۶:۱ می‌دهد؛ یعنی فیلدِ فوکوس‌شده در تمِ تیره
   دقیقاً شبیهِ فیلدِ عادی بود. `--focus` با تم می‌چرخد. */
.input:focus { outline: none; border-color: var(--focus); box-shadow: var(--ring); }
.input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; box-shadow: none; }
.input:disabled { opacity: 0.5; cursor: not-allowed; }
.input[readonly] { background: var(--surface-2); }

/* ─── Section frame ─────────────────────────────────────────── */
.section { padding-top: 5rem; padding-bottom: 5rem; }
.container-narrow { max-width: 64rem; margin-inline: auto; padding-inline: 1.25rem; }

/* ─── Eyebrow / micro-labels ────────────────────────────────── */
.eyebrow {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  /* `--gold` روی زمینهٔ روشن ۳٫۰۴:۱ می‌دهد و این متن ۱۱ پیکسل است — زیرِ AA.
     `--gold-ink` همان طلایی، تیره‌ترشده برای متن، ۵٫۹:۱؛ و در تمِ تیره خودش
     به `--gold-light` می‌رود، پس هر دو تم پوشش دارند. */

/* ─── Rendered Markdown (announcements) ─────────────────────────── */

/* `--navy-deep` رنگِ **برند** است و در `.dark` عوض نمی‌شود؛ به‌عنوانِ رنگِ

   را دارد ولی با تم می‌چرخد. */

.markdown-body h4 { font-weight: 700; font-size: 0.95rem; color: var(--heading); margin: 0.6rem 0 0.35rem; }
.markdown-body h5 { font-weight: 700; font-size: 0.9rem; color: var(--text); margin: 0.5rem 0 0.3rem; }
.markdown-body p { margin: 0 0 0.6rem; }
.markdown-body ul, .markdown-body ol { margin: 0 0 0.6rem; padding-inline-start: 1.4rem; }
.markdown-body li { margin: 0.2rem 0; }
.markdown-body a { color: var(--navy); font-weight: 700; text-decoration: underline; }
.dark .markdown-body a { color: var(--gold-soft); }
.markdown-body strong { color: var(--text); font-weight: 800; }
.markdown-body code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0.05rem 0.35rem; font-size: 0.85em; }

.markdown-body :last-child { margin-bottom: 0; }

.trust-row { color: var(--text-3); font-weight: 700; }

/* ─── Scroll reveal (landing) ───────────────────────────────────
   کلاسِ .reveal فقط با JS و تنها وقتی حرکت مجاز است اعمال می‌شود
   (رجوع به components/landing/Reveal.tsx). بنابراین در حالتِ
   بدون‌JS یا reduced-motion، محتوا هرگز مخفی نمی‌ماند. */

  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.55s cubic-bezier(0.2, 0.6, 0.2, 1),
              transform 0.55s cubic-bezier(0.2, 0.6, 0.2, 1);
  will-change: opacity, transform;
}
.reveal.is-visible {
  opacity: 1;
  transform: none;
}

/* ─── Interaction & entrance utilities (landing punch) ──────────────
   حرکت فقط با transform/opacity (بدون CLS)، ۱۵۰–۳۰۰ms، و با احترام به

@keyframes riseIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}
.anim-rise { opacity: 0; animation: riseIn 0.7s cubic-bezier(0.2,0.6,0.2,1) forwards; }
.anim-d1 { animation-delay: 0.04s; }
.anim-d2 { animation-delay: 0.12s; }
.anim-d3 { animation-delay: 0.20s; }
.anim-d4 { animation-delay: 0.28s; }
.anim-d5 { animation-delay: 0.36s; }

  width: max-content;

}
