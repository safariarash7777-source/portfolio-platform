name: Relay health

# بررسیِ سلامتِ رله — **بدونِ هیچ انتشاری**.
#
# چرا فایلِ جدا: در اجرای 34955555129 انتشار موفق شد ولی گامِ دفترداریِ بعدش
# افتاد و `/healthz` skipped شد. اگر تنها راهِ سلامت‌سنجی «یک deploy دیگر»
# باشد، برای دیدنِ حالِ چیزی که مستقر است باید دوباره مستقرش کنیم — و چون
# «استقرارِ بدونِ اختلال» روی این اپ خاموش است، هر بار یک قطعیِ بی‌دلیل.
#
# این workflow هیچ‌وقت چیزی منتشر نمی‌کند و هیچ پرچمی را تغییر نمی‌دهد.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only operation (discovery remains source-closed)"
        type: choice
        options: [health, discovery]
        default: health
        required: true
      note:
        description: "یادداشت برای این بررسی (اختیاری)"
        required: false
        default: ""
      metadata_only:
        description: "Read only Liara account configuration; no relay/provider requests"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: relay-health
  cancel-in-progress: false

env:
  HEALTH_URL: "https://arsadata.liara.run/healthz"
  DEBUG_URL: "https://arsadata.liara.run/debug"
  PHASE28_APPLIED: "false"

jobs:
  check:
    if: ${{ (inputs.operation == 'health' || inputs.operation == '') }}
    name: Relay health → arsadata
    runs-on: ubuntu-latest
    steps:
      # شاهد و منطقِ همان commit تغییرناپذیر workflow؛ این کار deploy نمی‌کند.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: زنده‌بودن
        id: live
        if: inputs.metadata_only != true
        run: |
          set -uo pipefail
          for i in $(seq 1 12); do
            BODY=$(curl -fsS --max-time 10 "$HEALTH_URL" || true)
            if [ "$BODY" = "ok" ]; then
              echo "healthz=ok" >> "$GITHUB_OUTPUT"
              echo "::notice::/healthz پس از ${i} تلاش ok شد."
              exit 0
            fi
            sleep 5
          done
          echo "healthz=fail" >> "$GITHUB_OUTPUT"
          echo "::error::/healthz تا یک دقیقه ok نشد."
          exit 1

      # `/healthz` فقط می‌گوید فرایندی روی پورت جواب می‌دهد. شاهدِ **نسخه**
      # کلیدِ historySections است که فقط در کدِ هدف وجود دارد.
      - name: شاهدِ نسخه از /debug
        id: version
        if: always() && steps.live.outputs.healthz == 'ok'
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY_TOKEN:-}" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::سکرتِ RELAY_TOKEN ثبت نشده — شاهدِ نسخه خوانده نشد. «در انتظار»، نه موفق."
            exit 0
          fi
          BODY=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${RELAY_TOKEN}" "$DEBUG_URL" || true)
          if printf '%s' "$BODY" | node scripts/deploy/relay-gate.mjs accept "{\"phase28Applied\": ${PHASE28_APPLIED}}"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: فاصلهٔ واقعی درخواست‌های BrsApi
        if: steps.version.outputs.status == 'passed'
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          for (let i = 0; i < 3; i++) {
            if (i) await new Promise(resolve => setTimeout(resolve, 10000));
            const response = await fetch(process.env.DEBUG_URL, {
              headers: { Authorization: `Bearer ${process.env.RELAY_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error(`debug HTTP ${response.status}`);
            const { brsapiTransport: t } = await response.json();
            if (!t || t.enabled !== true || t.scope !== 'process' || t.spacingMs !== 100 ||
                !Number.isSafeInteger(t.sent) || t.sent < 2 ||
                !Number.isFinite(t.minStartGapMs) || t.minStartGapMs < 100) {
              throw new Error('BrsApi live spacing is missing, insufficient, or below 100ms');
            }
            console.log(JSON.stringify({ sample: i + 1, scope: 'process', sent: t.sent,
              spacingMs: t.spacingMs, minStartGapMs: t.minStartGapMs }));
          }
          console.log('Per-process spacing verified; replica count and external key users remain separate checks.');
          NODE

      - name: Single passive health and storage receipt
        if: always() && inputs.metadata_only != true
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: node scripts/ops/relay-health-receipt.mjs

      - name: Preserve sanitized receipt
        if: always() && inputs.metadata_only != true
        uses: actions/upload-artifact@v4
        with:
          name: relay-health-receipt
          path: relay-health-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Existing account egress configuration only
        if: inputs.metadata_only == true
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: node scripts/ops/relay-egress-inventory.mjs

      - name: Preserve sanitized egress configuration
        if: always() && inputs.metadata_only == true
        uses: actions/upload-artifact@v4
        with:
          name: relay-egress-inventory
          path: relay-egress-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: گزارش
        if: always()
        env:
          NOTE: ${{ inputs.note }}
          LIVE: ${{ steps.live.outputs.healthz }}
          VER: ${{ steps.version.outputs.status }}
        run: |
          {
            echo "| بررسی | نتیجه |"
            echo "|---|---|"
            echo "| زنده‌بودن (\`/healthz\`) | \`${LIVE:-اجرا نشد}\` |"
            echo "| شاهدِ نسخه (\`/debug\`) | \`${VER:-در انتظار}\` |"
            echo "| یادداشت | ${NOTE:-—} |"
            echo ""
            echo "این اجرا **هیچ چیزی منتشر نکرده** و هیچ پرچمی را تغییر نداده."
          } >> "$GITHUB_STEP_SUMMARY"

  discovery:
    if: ${{ inputs.metadata_only != true && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.operation == 'discovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout immutable control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: 6e53c0f5b76fe543741b6166131c6e57dd2e37de
          path: reviewed
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify independent source pins and closed preflight
        id: preflight
        env:
          DISCOVERY_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const deny=()=>{throw Error('source_identity_rejected');};
          try {
            const git=(cwd,args)=>execFileSync('git',args,{cwd,encoding:'utf8',stdio:['ignore','pipe','ignore'],timeout:1000,maxBuffer:4096}).trim();
            const read=(path,cap)=>{
              const parts=path.split('/');for(let i=1;i<parts.length;i++)if(!fs.lstatSync(parts.slice(0,i).join('/')).isDirectory()||fs.lstatSync(parts.slice(0,i).join('/')).isSymbolicLink())deny();
              const fd=fs.openSync(path,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW|fs.constants.O_NONBLOCK);
              try{const a=fs.fstatSync(fd);if(!a.isFile()||a.size>cap)deny();const b=Buffer.alloc(a.size+1);const n=fs.readSync(fd,b,0,b.length,0),z=fs.fstatSync(fd);if(n!==a.size||a.size!==z.size||a.ino!==z.ino||a.mtimeMs!==z.mtimeMs||a.ctimeMs!==z.ctimeMs)deny();return b.subarray(0,n);}finally{fs.closeSync(fd);}
            };
            const control=git('control',['rev-parse','HEAD']);
            if(!/^[a-f0-9]{40}$/.test(control)||control!==process.env.GITHUB_WORKFLOW_SHA||control!==process.env.GITHUB_SHA||process.env.GITHUB_REPOSITORY!=='safariarash7777-source/portfolio-platform'||process.env.GITHUB_REF!=='refs/heads/main'||process.env.GITHUB_EVENT_NAME!=='workflow_dispatch'||process.env.GITHUB_RUN_ATTEMPT!=='1'||process.env.DISCOVERY_OPERATION!=='discovery')deny();
            const manifestPath='scripts/ops/liara-discovery-source.json';
            const raw=read('control/'+manifestPath,8192);
            const blob=b=>createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');
            if(blob(raw)!==git('control',['rev-parse','HEAD:'+manifestPath]))deny();
            const m=JSON.parse(raw.toString('utf8'));
            const paths=['scripts/ops/liara-binding-discovery-command.mjs','scripts/ops/liara-binding-discovery.mjs','scripts/ops/liara-discovery-websocket.mjs','scripts/ops/liara-binding-discovery-runner.mjs'];
            if(m.version!==1||Object.keys(m).sort().join(',')!=='files,sourceCommit,version'||m.sourceCommit!=='6e53c0f5b76fe543741b6166131c6e57dd2e37de'||git('reviewed',['rev-parse','HEAD'])!==m.sourceCommit||Object.keys(m.files).sort().join(',')!==[...paths].sort().join(','))deny();
            for(const p of paths){if(!/^[a-f0-9]{40}$/.test(m.files[p])||git('reviewed',['rev-parse','HEAD:'+p])!==m.files[p]||blob(read('reviewed/'+p,131072))!==m.files[p])deny();}
            execFileSync(process.execPath,['reviewed/scripts/ops/liara-binding-discovery-runner.mjs','--preflight'],{stdio:['ignore','inherit','ignore'],timeout:5000});
          }catch{console.log('{"state":"source_identity_rejected","authorized":false,"remoteHalt":"not_started"}');process.exitCode=1;}
          NODE
      - name: Single authorized discovery receipt
        if: steps.preflight.outputs.authorized == 'true'
        env:
          DISCOVERY_OPERATION: ${{ inputs.operation }}
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: node reviewed/scripts/ops/liara-binding-discovery-runner.mjs --execute > liara-binding-discovery-receipt.json
      - name: Upload sanitized discovery receipt
        if: always() && steps.preflight.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liara-binding-discovery-receipt
          path: liara-binding-discovery-receipt.json
          if-no-files-found: error
          retention-days: 14
