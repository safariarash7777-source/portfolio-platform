name: CI

# دروازهٔ کیفیتِ هر PR. تا پیش از این، مخزن **هیچ** workflowی نداشت (بلاکرِ B-015)
# و PRها بدونِ هیچ تأییدِ خودکاری merge می‌شدند.
#
# قانونِ سخت: این workflow **هرگز** به دیتابیسِ Supabase (Production یا Staging)
# وصل نمی‌شود، هیچ migrationی روی آن‌ها اجرا نمی‌کند و به هیچ سکرتی نیاز ندارد.
#
# ⚠️ این جمله در `G2-006` دقیق‌تر شد. پیش‌تر نوشته بود «هرگز به دیتابیس وصل
# نمی‌شود» و jobِ `leads-db` آن را نقض می‌کرد. نیتِ اصلی «به دیتابیسِ ما وصل
# نشو» بود، نه «هیچ Postgresی را اجرا نکن». `leads-db` یک Postgresِ
# **یک‌بارمصرفِ داخلِ runner** بالا می‌آورد که هیچ داده‌ای از ما ندارد، هیچ سکرتی
# نمی‌خواهد و با پایانِ job نابود می‌شود. متن اصلاح شد تا سند با واقعیت یکی بماند.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# اجراهای قدیمیِ همان شاخه لغو می‌شوند تا دقیقهٔ رایگان هدر نرود.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── ۱) وابستگی‌ها ──────────────────────────────────────────────────────────
  # هم‌گامیِ package.json با package-lock.json را اثبات می‌کند: اگر lock عقب
  # باشد `npm ci` مردود می‌شود (همان چیزی که B-013 بود).
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # `.gitignore` جلوی commitِ تصادفی را می‌گیرد ولی `git add -f` را نه، و
      # لاکی که از قبل tracked باشد را هم پاک نمی‌کند. این گیت روی چیزی که
      # واقعاً در درختِ گیت است کار می‌کند — همان چیزی که Vercel می‌بیند.
      # علتِ B-023 دقیقاً همین بود: وجودِ `pnpm-lock.yaml` باعث می‌شد Vercel با
      # pnpm بیلد کند و هر تغییرِ `package.json` استقرار را با
      # ERR_PNPM_OUTDATED_LOCKFILE بشکند، در حالی که CI با npm سبز می‌ماند.
      - name: فقط یک package manager — لاکِ pnpm/yarn نباید برگردد
        run: |
          found=$(git ls-files -- pnpm-lock.yaml yarn.lock 'npm-shrinkwrap.json')
          if [ -n "$found" ]; then
            echo "::error::لاک‌فایلِ غیرمجاز در درختِ گیت: $found"
            echo "npm تنها package managerِ این مخزن است (packageManager در package.json)."
            exit 1
          fi
          test -f package-lock.json || { echo "::error::package-lock.json نیست"; exit 1; }
          echo "✅ فقط package-lock.json"

      - name: npm ci (اثباتِ هم‌گامیِ lockfile)
        run: npm ci
      - name: audit — سطحِ critical مسدودکننده است
        run: npm audit --audit-level=critical
      - name: audit — گزارشِ high (مسدودکننده نیست، ولی پنهان هم نمی‌شود)
        if: always()
        run: npm audit --audit-level=high || true

  # ── ۲) کیفیتِ کد ──────────────────────────────────────────────────────────
  quality:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `next lint` تعاملی بود و در CI هنگ می‌کرد (B-014). حالا ESLint CLI با
      # flat config است و هر warning هم مردود حساب می‌شود.
      #
      # ابزارِ لینت قبلاً موقت نصب می‌شد چون افزودنش به devDependencies استقرارِ
      # Vercel را می‌شکست. علتِ واقعی اندازهٔ درختِ وابستگی نبود، بلکه `pnpm-lock.yaml`ِ
      # ناهم‌گام بود (B-023): Vercel با pnpm بیلد می‌کرد و آن لاک هرگز بازتولید
      # نمی‌شد. با حذفِ آن لاک و تثبیتِ npm، ابزار حالا وابستگیِ عادی است.
      - name: Lint
        run: npm run lint:ci

      - name: Core tests
        run: npm run test:core

      - name: Calc tests
        run: npm run test:calc

      # build آخر است: گران‌ترین گام، بعد از ارزان‌ترین بازخوردها.
      - name: Build
        run: npm run build
        env:
          # مقادیرِ ساختگیِ زمانِ build — هیچ‌کدام سکرتِ واقعی نیستند و به هیچ
          # سرویسی وصل نمی‌شوند؛ فقط برای اینکه build روی env خالی نشکند.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only

  # ── ۳) امنیت و migration (بدونِ اتصال به دیتابیس) ─────────────────────────
  security-and-sql:
    name: Secret scan · SQL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: اسکنِ الگوی سکرت
        run: node scripts/scan-secrets.mjs

      - name: اعتبارسنجیِ سیاستیِ SQL
        run: node scripts/validate-sql.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصبِ پارسرِ Postgres
        run: pip install "pglast==8.4"
      - name: اعتبارسنجیِ گرامرِ SQL (libpg_query — بدونِ اجرا)
        run: python3 scripts/validate-sql-grammar.py

  # ── ۴) رفتارِ واقعیِ RLS و گرنت‌های جدولِ لید ──────────────────────────────
  # چرا جدا از `quality`: این تنها jobی است که یک Postgres لازم دارد.
  #
  # چه چیزی را می‌گیرد که تستِ ایستا نمی‌گیرد: `lib/leads/grants.test.ts` فقط
  # **متنِ** `sql/phase8b_leads.sql` را می‌خوانَد. این job همان فایل را روی یک
  # Postgresِ واقعی اجرا می‌کند و **رفتار** را می‌سنجد — با نقش‌های واقعیِ
  # `anon`/`authenticated`/`service_role` و امتیازهای پیش‌فرضِ Supabase.
  #
  # ریشه‌اش یافتهٔ `G2-006` است: `authenticated` امتیازِ `TRUNCATE` داشت و **RLS
  # روی `TRUNCATE` اعمال نمی‌شود**. Security Advisorِ Supabase هم آن را نگرفت.
  # آخرین تستِ این فایل عمداً نسخهٔ معیوب را می‌سازد و ثابت می‌کند تست پوچ نیست.
  leads-db:
    name: Lead RLS · Grants (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgresِ یک‌بارمصرفِ داخلِ runner. نه Supabase، نه دادهٔ واقعی، نه سکرت.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: نصبِ کلاینتِ psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: تستِ یکپارچگیِ leads
        run: npm run test:db
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres

  # ── ۵) دروازهٔ نهایی ──────────────────────────────────────────────────────
  # یک چکِ واحد برای required status check، تا لازم نباشد هر بار که jobی اضافه
  # می‌شود تنظیماتِ branch protection دست بخورد.
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [dependencies, quality, security-and-sql, leads-db]
    if: always()
    steps:
      - name: بررسیِ نتیجهٔ همهٔ jobها
        run: |
          echo "dependencies:     ${{ needs.dependencies.result }}"
          echo "quality:          ${{ needs.quality.result }}"
          echo "security-and-sql: ${{ needs.security-and-sql.result }}"
          echo "leads-db:         ${{ needs.leads-db.result }}"
          if [ "${{ needs.dependencies.result }}" != "success" ] \
            || [ "${{ needs.quality.result }}" != "success" ] \
            || [ "${{ needs.security-and-sql.result }}" != "success" ] \
            || [ "${{ needs.leads-db.result }}" != "success" ]; then
            echo "::error::CI مردود شد."
            exit 1
          fi
          echo "همهٔ گیت‌ها سبز."
