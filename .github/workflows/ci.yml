name: CI

# دروازهٔ کیفیتِ هر PR. تا پیش از این، مخزن **هیچ** workflowی نداشت (بلاکرِ B-015)
# و PRها بدونِ هیچ تأییدِ خودکاری merge می‌شدند.
#
# قانونِ سخت: این workflow **هرگز** به دیتابیسِ Supabase (Production یا Staging)
# وصل نمی‌شود، هیچ migrationی روی آن‌ها اجرا نمی‌کند و به هیچ سکرتی نیاز ندارد.
#
# ⚠️ این جمله در `G2-006` دقیق‌تر شد. پیش‌تر نوشته بود «هرگز به دیتابیس وصل
# نمی‌شود» و jobِ `leads-db` آن را نقض می‌کرد. نیتِ اصلی «به دیتابیسِ ما وصل
# نشو» بود، نه «هیچ Postgresی را اجرا نکن». `leads-db` یک Postgresِ
# **یک‌بارمصرفِ داخلِ runner** بالا می‌آورد که هیچ داده‌ای از ما ندارد، هیچ سکرتی
# نمی‌خواهد و با پایانِ job نابود می‌شود. متن اصلاح شد تا سند با واقعیت یکی بماند.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# اجراهای قدیمیِ همان شاخه لغو می‌شوند تا دقیقهٔ رایگان هدر نرود.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── ۱) وابستگی‌ها ──────────────────────────────────────────────────────────
  # هم‌گامیِ package.json با package-lock.json را اثبات می‌کند: اگر lock عقب
  # باشد `npm ci` مردود می‌شود (همان چیزی که B-013 بود).
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # `.gitignore` جلوی commitِ تصادفی را می‌گیرد ولی `git add -f` را نه، و
      # لاکی که از قبل tracked باشد را هم پاک نمی‌کند. این گیت روی چیزی که
      # واقعاً در درختِ گیت است کار می‌کند — همان چیزی که Vercel می‌بیند.
      # علتِ B-023 دقیقاً همین بود: وجودِ `pnpm-lock.yaml` باعث می‌شد Vercel با
      # pnpm بیلد کند و هر تغییرِ `package.json` استقرار را با
      # ERR_PNPM_OUTDATED_LOCKFILE بشکند، در حالی که CI با npm سبز می‌ماند.
      - name: فقط یک package manager — لاکِ pnpm/yarn نباید برگردد
        run: |
          found=$(git ls-files -- pnpm-lock.yaml yarn.lock 'npm-shrinkwrap.json')
          if [ -n "$found" ]; then
            echo "::error::لاک‌فایلِ غیرمجاز در درختِ گیت: $found"
            echo "npm تنها package managerِ این مخزن است (packageManager در package.json)."
            exit 1
          fi
          test -f package-lock.json || { echo "::error::package-lock.json نیست"; exit 1; }
          echo "✅ فقط package-lock.json"

      - name: npm ci (اثباتِ هم‌گامیِ lockfile)
        run: npm ci
      - name: audit — سطحِ critical مسدودکننده است
        run: npm audit --audit-level=critical
      - name: audit — گزارشِ high (مسدودکننده نیست، ولی پنهان هم نمی‌شود)
        if: always()
        run: npm audit --audit-level=high || true

  # ── ۲) کیفیتِ کد ──────────────────────────────────────────────────────────
  quality:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `next lint` تعاملی بود و در CI هنگ می‌کرد (B-014). حالا ESLint CLI با
      # flat config است و هر warning هم مردود حساب می‌شود.
      #
      # ابزارِ لینت قبلاً موقت نصب می‌شد چون افزودنش به devDependencies استقرارِ
      # Vercel را می‌شکست. علتِ واقعی اندازهٔ درختِ وابستگی نبود، بلکه `pnpm-lock.yaml`ِ
      # ناهم‌گام بود (B-023): Vercel با pnpm بیلد می‌کرد و آن لاک هرگز بازتولید
      # نمی‌شد. با حذفِ آن لاک و تثبیتِ npm، ابزار حالا وابستگیِ عادی است.
      - name: Lint
        run: npm run lint:ci

      - name: Core tests
        run: npm run test:core

      - name: Calc tests
        run: npm run test:calc

      - name: Relay tests (no external services)
        run: npm run test:relay

      # build آخر است: گران‌ترین گام، بعد از ارزان‌ترین بازخوردها.
      - name: Build
        run: npm run build
        env:
          # مقادیرِ ساختگیِ زمانِ build — هیچ‌کدام سکرتِ واقعی نیستند و به هیچ
          # سرویسی وصل نمی‌شوند؛ فقط برای اینکه build روی env خالی نشکند.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only

  # ── ۳) امنیت و migration (بدونِ اتصال به دیتابیس) ─────────────────────────
  security-and-sql:
    name: Secret scan · SQL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: اسکنِ الگوی سکرت
        run: node scripts/scan-secrets.mjs

      - name: اعتبارسنجیِ سیاستیِ SQL
        run: node scripts/validate-sql.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصبِ پارسرِ Postgres
        run: pip install "pglast==8.4"
      - name: اعتبارسنجیِ گرامرِ SQL (libpg_query — بدونِ اجرا)
        run: python3 scripts/validate-sql-grammar.py

  # ── ۴) رفتارِ واقعیِ RLS، گرنت و یکپارچگیِ دیتابیس ─────────────────────────
  # چرا جدا از `quality`: این تنها jobی است که یک Postgres لازم دارد.
  #
  # چه چیزی را می‌گیرد که تستِ ایستا نمی‌گیرد: `lib/leads/grants.test.ts` فقط
  # **متنِ** `sql/phase8b_leads.sql` را می‌خوانَد. این job همان فایل را روی یک
  # Postgresِ واقعی اجرا می‌کند و **رفتار** را می‌سنجد — با نقش‌های واقعیِ
  # `anon`/`authenticated`/`service_role`.
  #
  # migration مقابلِ **دو پروفایلِ امتیاز** اجرا می‌شود:
  #   • `legacy`   — بدترین‌حالتی که روی پروژهٔ stagingِ **خودمان** اندازه گرفتیم
  #   • `explicit` — محیطی که هیچ امتیازِ خودکاری نمی‌دهد
  # نتیجهٔ نهایی باید در هر دو یکسان باشد.
  #
  # ریشه‌اش یافتهٔ `G2-006` است: `authenticated` امتیازِ `TRUNCATE` داشت و **RLS
  # روی `TRUNCATE` اعمال نمی‌شود**. Security Advisorِ Supabase هم آن را نگرفت.
  # یک تستِ جداگانه عمداً نسخهٔ معیوب را می‌سازد و ثابت می‌کند گارد پوچ نیست.
  leads-db:
    name: Database RLS · Integrity (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgresِ یک‌بارمصرفِ داخلِ runner. نه Supabase، نه دادهٔ واقعی، نه سکرت.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: نصبِ کلاینتِ psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # `CI=true` را خودِ GitHub Actions ست می‌کند و تست روی همان تکیه می‌کند:
      # اگر Postgres یا psql نباشد، به‌جای skip **خطا می‌دهد**.
      - name: تستِ یکپارچگیِ leads و intelligence
        # `set -o pipefail` لازم است چون خروجی از `tee` رد می‌شود و بدونِ آن کدِ
        # خروجیِ `tee` (همیشه ۰) گزارش می‌شود، نه کدِ خروجیِ تست.
        run: |
          set -o pipefail
          npm run test:db 2>&1 | tee /tmp/leads-db.log
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres

      # چرا شمردنِ pass لازم است و گرپِ `# skip` کافی نیست:
      #
      # ⚠️ این گارد بلافاصله کارش را کرد. اولین اجرای مشترکِ leads + cron در CI
      # این را داد: `# pass 45 · # fail 0 · # cancelled 14 · # skipped 0`.
      # یعنی ۱۴ تست **اصلاً اجرا نشدند** و هیچ‌کدام «مردود» هم نبودند — بدونِ
      # کفِ تعداد، این یک اجرای کاملاً سبز به‌نظر می‌رسید. علتش هم‌زمانیِ دو
      # فایلی بود که یک سرورِ Postgres مشترک دارند و هرکدام دیتابیس می‌سازد و
      # drop می‌کند؛ `--test-concurrency=1` آن مسابقه را برمی‌دارد.
      #
      # وقتی یک **suite** اسکیپ شود، node:test آن را در `# skipped` نمی‌شمارد و
      # عددِ صفر گزارش می‌کند. یعنی یک اجرای کاملاً اسکیپ‌شده دقیقاً شبیهِ یک
      # اجرای سالم به‌نظر می‌رسد. تنها چیزی که هر دو حالت را می‌گیرد — هم اسکیپِ
      # خاموش، هم ناپدیدشدنِ تست‌ها — کفِ تعدادِ pass است.
      - name: شمارشِ واقعیِ تست‌ها — اسکیپِ خاموش مجاز نیست
        run: |
          pass=$(grep -oP '^# pass \K\d+' /tmp/leads-db.log | head -1)
          fail=$(grep -oP '^# fail \K\d+' /tmp/leads-db.log | head -1)
          skip=$(grep -oP '^# skipped \K\d+' /tmp/leads-db.log | head -1)
          suites=$(grep -oP '^# suites \K\d+' /tmp/leads-db.log | head -1)
          echo "pass=$pass fail=$fail skipped=$skip suites=$suites"
          {
            echo "### Database RLS · Integrity (Postgres)"
            echo ""
            echo "| متریک | مقدار |"
            echo "|---|---|"
            echo "| pass | $pass |"
            echo "| fail | $fail |"
            echo "| skipped | $skip |"
            echo "| suites | $suites |"
          } >> "$GITHUB_STEP_SUMMARY"

          # مقدارِ **اندازه‌گیری‌شده** روی اجرای واقعیِ هر سه suite:
          # `P2-G3-002`، اجرای ۳۰۶۱۸۰۳۵۰۴۶ → `pass=89 fail=0 skipped=0 suites=7`.
          # هر سه با دو پروفایلِ امتیاز و گاردهای failability اجرا می‌شوند.
          #
          # ⚠️ این عدد حدس نیست و نباید حدسی به‌روز شود: پس از rebaseِ `P2-G2-013`
          # کفِ ۵۹ (main) و کفِ ۴۲ (PR #97) هیچ‌کدام دیگر درست نبودند، چون هر دو
          # فقط زیرمجموعه‌ای از suiteها را می‌شمردند. عدد از اجرای واقعی آمد.
          #
          # ۸۵ → ۸۹ در `P2-G3-002`: چهار تستِ تازهٔ `service_role` (دو تست × دو
          # پروفایل). عمداً **پس از** سبزشدن به‌روز شد، نه با جمعِ ۸۷+۲ از اجرای
          # قرمز — کفی که از حساب می‌آید همان چیزی است که این کامنت منع می‌کند.
          #
          # ۸۹ → ۱۶۵ در `P2-CLAUDE-MEGA-003`: `workflow.integration.test.ts`
          # (۳۸ تست × ۲ پروفایل) به `test:db` اضافه شد. باز هم از اجرای واقعیِ
          # کاملاً سبز خوانده شد — `pass=165 fail=0 skipped=0 suites=9` — نه از
          # جمعِ ۸۹+۷۶.
          #
          # ۱۶۵ → ۱۸۷ در `P2-CLAUDE-MEGA-004`: `grants.integration.test.ts`
          # (گاردِ `B-044`) به `test:db` اضافه شد. مثلِ دفعاتِ قبل از اجرای واقعیِ
          # سبز خوانده شد — `pass=187 fail=0 skipped=0 suites=14`.
          # ۱۸۷ → ۲۰۴ در `P2-OPS-MEGA-005`: `backup-restore.integration.test.ts`
          # به `test:db` اضافه شد — بازگردانیِ اتمیک، تزریقِ خطای عمدی و
          # حساسیتِ اثرِ انگشت روی Postgresِ واقعی. از اجرای واقعیِ سبز خوانده
          # شد: `pass=204 fail=0 skipped=0 suites=19`.
          # ۲۰۴ → ۲۳۸ در `P2-CORE-RADAR-001`: `changeRadar.integration.test.ts`
          # (رادارِ تغییر، `phase26`) به `test:db` اضافه شد — ایده‌مپوتنسیِ کلیدِ
          # یکتا، گاردِ append-only، تفکیکِ «دیده‌شده» بینِ دو کاربرِ واقعی، و
          # اندازه‌گیریِ گرنت‌ها روی هر دو پروفایل. مثلِ همیشه از یک اجرای واقعیِ
          # کاملاً سبز خوانده شد، نه از جمعِ ۲۰۴+۳۴:
          # `pass=238 fail=0 skipped=0 suites=21`.
          # ۲۳۸ → ۲۷۸ در `D-031`: `memberImport.integration.test.ts` (`phase27`)
          # به `test:db` اضافه شد — پیش‌نمایشِ بدونِ اعطا، تطبیق، تکرارناپذیری،
          # مسیرِ تطبیق‌نیافته، لغوِ برگشت‌پذیر و حریمِ شناسهٔ تماس. همهٔ دادهٔ
          # آن مصنوعی است. از اجرای واقعیِ سبز خوانده شد:
          # `pass=278 fail=0 skipped=0 suites=23`.
          # ۲۷۸ → ۲۹۸ در بازبینیِ نسخهٔ ۱٫۱: `phase27` بازنویسی شد تا به‌جای یک
          # سامانهٔ دسترسیِ موازی، `public.entitlements` را تولید کند — و تمدید،
          # انقضا و لغوِ موردی هم پوشش گرفتند. از اجرای واقعیِ سبز خوانده شد:
          # `pass=298 fail=0 skipped=0 suites=23`.
          MIN_PASS=298

          # ⚠️ `# fail` همهٔ شکست‌ها را نمی‌شمارد. وقتی یک هوکِ `before` بترکد،
          # node:test کلِ suite را با `not ok` علامت می‌زند ولی `# fail` همچنان
          # **۰** می‌ماند. این با یک migrationِ عمداً معیوب سنجیده شد:
          # `pass 22 → 10`، سه suite با `not ok`، و `# fail 0`.
          # پس علاوه بر `# fail`، خودِ نشانگرِ `not ok` هم بررسی می‌شود.
          notok=$(grep -cE '^not ok ' /tmp/leads-db.log || true)
          [ "${notok:-0}" = "0" ] || { echo "::error::$notok مورد 'not ok' در خروجی تست — احتمالاً هوکِ before شکسته"; exit 1; }
          [ "${fail:-1}" = "0" ] || { echo "::error::تستِ دیتابیس مردود شد (fail=$fail)"; exit 1; }
          [ "${skip:-1}" = "0" ] || { echo "::error::اسکیپ در CI مجاز نیست (skipped=$skip)"; exit 1; }
          if [ "${pass:-0}" -lt "$MIN_PASS" ]; then
            echo "::error::فقط $pass تست اجرا شد؛ حداقل $MIN_PASS انتظار می‌رفت."
            echo "::error::یا تست‌ها اسکیپ شده‌اند یا حذف شده‌اند — هر دو یعنی این گیت دیگر چیزی را نمی‌سنجد."
            exit 1
          fi
          echo "✅ $pass تستِ واقعی روی Postgres اجرا شد (leads · cron_runs · intelligence — هر کدام ۲ پروفایلِ امتیاز + گاردِ failability)."

  # ── ۵) دروازهٔ نهایی ──────────────────────────────────────────────────────
  # یک چکِ واحد برای required status check، تا لازم نباشد هر بار که jobی اضافه
  # می‌شود تنظیماتِ branch protection دست بخورد.
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [dependencies, quality, security-and-sql, leads-db]
    if: always()
    steps:
      - name: بررسیِ نتیجهٔ همهٔ jobها
        run: |
          echo "dependencies:     ${{ needs.dependencies.result }}"
          echo "quality:          ${{ needs.quality.result }}"
          echo "security-and-sql: ${{ needs.security-and-sql.result }}"
          echo "leads-db:         ${{ needs.leads-db.result }}"
          if [ "${{ needs.dependencies.result }}" != "success" ] \
            || [ "${{ needs.quality.result }}" != "success" ] \
            || [ "${{ needs.security-and-sql.result }}" != "success" ] \
            || [ "${{ needs.leads-db.result }}" != "success" ]; then
            echo "::error::CI مردود شد."
            exit 1
          fi
          echo "همهٔ گیت‌ها سبز."

