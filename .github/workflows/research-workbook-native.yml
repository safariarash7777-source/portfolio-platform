name: Research workbook native recovery
on:
  pull_request:
    paths:
      - 'components/admin/ResearchWorkbook*'
      - 'components/admin/p07-component-test-host.ts'
      - 'lib/intelligence/workbook-*'
      - 'app/api/admin/intelligence/workbooks/**'
      - 'docs/ops/research-workbook-recovery-20261029/**'
      - '.github/workflows/research-workbook-native.yml'
  push:
    branches: [main]
    paths:
      - 'components/admin/ResearchWorkbook*'
      - 'lib/intelligence/workbook-*'
      - 'app/api/admin/intelligence/workbooks/**'
      - 'docs/ops/research-workbook-recovery-20261029/**'
      - '.github/workflows/research-workbook-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbook-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres17-reopen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5433'
      PGUSER: postgres
      PGPASSWORD: postgres
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Actual component reopen against disposable native PostgreSQL
        run: |
          set -o pipefail
          node node_modules/tsx/dist/cli.mjs --test --test-reporter=tap --test-concurrency=1 lib/intelligence/workbook-intent.integration.test.ts | tee /tmp/workbook-native.log
      - name: Verify actual counts and write sanitized receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          log = Path('/tmp/workbook-native.log').read_text()
          metric = lambda name: int(re.search(r'^# '+name+r' (\d+)$', log, re.M).group(1))
          assert metric('pass') >= 6 and metric('fail') == 0 and metric('skipped') == 0
          version = int(subprocess.check_output(['psql','-X','-qAt','-c','SHOW server_version_num'], text=True).strip())
          assert 170000 <= version < 180000
          receipt = dict(status='PASS', testedSha=os.environ['TESTED_SHA'], postgresVersionNumber=version,
              candidateSqlSha256=hashlib.sha256(Path('docs/ops/research-workbook-recovery-20261029/intent-store.candidate.sql').read_bytes()).hexdigest(),
              environment='disposable GitHub Actions PostgreSQL; synthetic data only',
              passed=metric('pass'), failed=metric('fail'), skipped=metric('skipped'),
              scenarios=['immutable native actor/hash/body', 'other-admin/member/anon and service-role BYPASSRLS denial',
                  'actual component destroyed after v2 commit and remounted; GET-only recovery',
                  'v1 and its review retained; v2 unapproved', 'private text read back exactly',
                  'candidate rerun preserves existing workbook/review INSERT freeze'],
              authBoundary='synthetic claims exercised under native authenticated SQL role; no real user session',
              productionTouched=False, modelCalls=0, browserPersistentPrivateBody=False)
          Path('workbook-native-receipt.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
      - name: Genuine Auth and real browser close, reopen and reload
        timeout-minutes: 12
        run: node --import tsx scripts/isolated-e2e/workbook-browser.mjs
        env:
          P09_NATIVE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: workbook-native-receipt
          path: workbook-native-receipt.json
          retention-days: 7
