name: cron-alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: cron-alerts
  cancel-in-progress: false
jobs:
  evaluate-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call alerts endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::warning::CRON_SECRET or SITE_URL secret not configured — skipping."
            exit 0
          fi
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/alerts" )
          echo "HTTP $code"
          cat /tmp/resp.json
          [ "$code" = "200" ]
