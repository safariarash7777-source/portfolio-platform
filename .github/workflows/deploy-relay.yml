name: Deploy relay

# ── چرا این فایل وجود دارد ──────────────────────────────────────────────────
# مسیرِ «اتصالِ مستقیمِ مخزن» در کنسولِ لیارا با `"port" is required` رد می‌شود
# (`B-053`). ⚠️ **علتِ ریشه‌ای هنوز تأیید نشده** — لاگِ بیلد خوانده نشده و
# ثابت‌ماندنِ `relay/liara.json` بینِ `6570aaf` و `main` هم آن را اثبات نمی‌کند.
# آنچه این workflow حل می‌کند این است که سه چیزِ ضروریِ انتشار دیگر ضمنی و
# وابسته به حالتِ کنسول نباشند:
#
#   app = arsadata · source = relay/ · port = 3400
#
# ⚠️ دو منتشرکنندهٔ هم‌زمان ممنوع: پیش از فعال‌شدنِ این مسیر، «اتصالِ مخزن» در
# کنسولِ اپ باید قطع شود. جزئیات: docs/RUNBOOK-relay-deploy.md
#
# ── نکتهٔ امنیتیِ ساختار ─────────────────────────────────────────────────────
# منطقِ دروازه‌ها از `scripts/deploy/relay-gate.mjs` **روی شاخهٔ پیش‌فرض** اجرا
# می‌شود، نه از کامیتی که منتشر می‌شود. بستهٔ انتشار با `git archive` در پوشهٔ
# موقت باز می‌شود تا درختِ کاری دست‌نخورده بماند. یعنی کامیتِ مقصد نمی‌تواند
# دروازه‌های خودش را بازنویسی کند.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA برای انتشار (کامل یا حداقل ۷ رقم)"
        required: true
      allow_older:
        description: "بازگشت — اجازهٔ انتشارِ کامیتی قدیمی‌تر از نسخهٔ مستقر (CIِ موفق همچنان لازم است)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read       # پرس‌وجوی اجراهای CI برای همان SHA
  deployments: write  # ثبتِ «چه چیزی مستقر است» — جای تگِ قبلی

concurrency:
  group: deploy-relay-arsadata
  cancel-in-progress: false

env:
  LIARA_CLI: "@liara/cli@9.5.1"   # همان نسخه‌ای که نحوِ پرچم‌هایش راستی‌آزمایی شده
  APP: arsadata
  PORT: "3400"
  PLATFORM: node
  BASELINE_ENV: relay-arsadata
  HEALTH_URL: "https://arsadata.liara.run/healthz"
  DEBUG_URL: "https://arsadata.liara.run/debug"
  # وضعیتِ واقعیِ Production (۲۰۲۶-۰۹-۱۴): نه `brsapi_budget_days` هست نه
  # `brsapi_budget_lease`. اگر روزی phase28 اجرا شد، این را آگاهانه `true` کن.
  PHASE28_APPLIED: "false"

jobs:
  deploy:
    name: Deploy relay → arsadata
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      # `ref: main` صریح است و **انتخابِ شاخه در workflow_dispatch منبعِ منطقِ
      # دروازه را عوض نمی‌کند**. بدونِ آن، اجرای دستی از یک شاخهٔ دلخواه،
      # `scripts/deploy/` همان شاخه را اجرا می‌کرد.
      # ⚠️ آنچه این تضمین نمی‌کند: خودِ فایلِ workflow را GitHub از refِ انتخابی
      # برمی‌دارد. مهارِ آن با دسترسیِ dispatch و محافظتِ شاخه است، نه اینجا.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: ثبتِ SHAِ منطقِ دروازه
        id: gatesrc
        run: echo "gate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: اعتبارسنجی و resolve کردنِ SHA
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RAW="${INPUT_SHA:-}"
          [ "$EVENT" = "workflow_dispatch" ] || RAW="$RUN_SHA"
          # اعتبارسنجی **پیش از** رسیدنِ مقدار به git — وگرنه ورودیِ کاربر
          # مستقیم به خطِ فرمان می‌رسد.
          CLEAN=$(node scripts/deploy/relay-gate.mjs sha "$RAW" | cut -d= -f2)
          FULL=$(git rev-parse --verify "${CLEAN}^{commit}")
          # و خروجیِ git هم اعتبارسنجی می‌شود: باید ۴۰ رقمِ کامل باشد.
          node scripts/deploy/relay-gate.mjs resolved "$FULL" >> "$GITHUB_OUTPUT"

      - name: دروازه — تعلق به تاریخچهٔ main و CIِ موفقِ همان SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
          ALLOW_OLDER: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_older }}
        run: |
          set -euo pipefail
          IN_MAIN=false
          git merge-base --is-ancestor "$SHA" origin/main && IN_MAIN=true || true

          # اجرای موفقِ **CI** روی همان SHA. فیلترِ head_sha به‌تنهایی کافی نیست:
          # workflowهای زمان‌بندی‌شده هم همان head_sha را دارند. پس مستقیم از
          # مسیرِ ci.yml پرسیده می‌شود.
          CI_OK=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{const d=JSON.parse(s);process.stdout.write(String((d.workflow_runs||[]).some(r=>r.conclusion==="success")));}
                catch{process.stdout.write("false");}});')

          # مبنا از رکوردِ deploymentِ GitHub خوانده می‌شود.
          #
          # پیش از این یک تگ بود و push‌اش رد شد: GitHub اجازه نمی‌دهد توکنِ یک
          # GitHub App، refی بسازد که فایلِ workflow را نسبت به شاخهٔ پیش‌فرض
          # عوض می‌کند. آن انتشار موفق شد ولی دفترداری‌اش نه.
          #
          # دو فیلتر لازم است و هیچ‌کدام اختیاری نیست:
          #   ۱. `environment=relay-arsadata` — این مخزن پر از رکوردِ deployment
          #      است که ربطی به رله ندارند: `Preview`/`Production` از
          #      `vercel[bot]` و `arsadata` از اتصالِ قدیمیِ `liara-cloud[bot]`.
          #      هیچ‌کدام نباید مبنای «چه چیزی روی رله مستقر است» شوند.
          #   ۲. آخرین وضعیتِ همان رکورد باید `success` باشد. خودِ رکورد فقط
          #      می‌گوید «تلاشی ثبت شد»، نه اینکه گرفت.
          BASELINE=null
          OLDER=false
          RELAY_CHANGED=false
          B=""
          for PAIR in $(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=${BASELINE_ENV}&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  try{const d=JSON.parse(s);
                    if(Array.isArray(d))for(const x of d)process.stdout.write(`${x.id}:${x.sha}\n`);}
                  catch{}});'); do
            ID=${PAIR%%:*}; CAND=${PAIR#*:}
            STATE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                      "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses?per_page=1" \
                    | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                        try{const d=JSON.parse(s);process.stdout.write(Array.isArray(d)&&d[0]?String(d[0].state):"");}
                        catch{process.stdout.write("");}});')
            if [ "$STATE" = "success" ]; then B="$CAND"; break; fi
          done
          if [ -n "$B" ] && git cat-file -e "${B}^{commit}" 2>/dev/null; then
            BASELINE="\"$B\""
            git merge-base --is-ancestor "$SHA" "$B" && OLDER=true || true
            # مبنای مقایسه **آخرین انتشارِ موفق** است، نه HEAD^ — وگرنه در یک
            # pushِ چندکامیتی، تغییرِ relay در کامیتِ ماقبلِ آخر جا می‌ماند.
            git diff --quiet "$B" "$SHA" -- relay/ || RELAY_CHANGED=true
          fi

          node scripts/deploy/relay-gate.mjs decide "{
            \"event\": \"$EVENT\",
            \"sha\": \"$SHA\",
            \"baseline\": $BASELINE,
            \"isAncestorOfMain\": $IN_MAIN,
            \"ciSuccess\": $CI_OK,
            \"isAncestorOfBaseline\": $OLDER,
            \"relayChangedSinceBaseline\": $RELAY_CHANGED,
            \"allowOlder\": ${ALLOW_OLDER:-false}
          }" >> "$GITHUB_OUTPUT"
          echo "baseline=${BASELINE//\"/}" >> "$GITHUB_OUTPUT"

      - name: وجودِ توکن
        if: steps.gate.outputs.action == 'publish'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          if [ -z "${LIARA_API_TOKEN:-}" ]; then
            echo "::error::سکرتِ LIARA_API_TOKEN تنظیم نشده. کنسولِ لیارا → API Token، سپس GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      # ── پیش‌پرواز ───────────────────────────────────────────────────────────
      # **fail-closed، بدونِ راهِ عبور.** اگر پرچم‌ها خوانده نشوند یا ساختارشان
      # درست نباشد، انتشار انجام نمی‌شود. هیچ پرچمی هم تغییر داده نمی‌شود.
      # ── پیش‌پرواز ───────────────────────────────────────────────────────────
      # **fail-closed، بدونِ راهِ عبور.** اگر پرچم‌ها خوانده نشوند یا ساختارشان
      # درست نباشد، انتشار انجام نمی‌شود. هیچ پرچمی هم تغییر داده نمی‌شود.
      #
      # خروجی به **فایل** می‌رود و کدِ خروج جداگانه نگه داشته می‌شود. نسخهٔ قبلی
      # `OUT=$(… | tr -d '\r')` بود: کدِ خروجِ `tr` را می‌گرفت نه کدِ `liara`، و
      # `OUT` هیچ‌وقت چاپ نمی‌شد. اجرای `34953490961` به همین دلیل در ۱۲ ثانیه با
      # «JSON معتبر نیست» افتاد، بدونِ اینکه کسی بفهمد چه شد.
      - name: پیش‌پرواز — پرچم‌های واقعیِ اپِ زنده
        id: preflight
        if: steps.gate.outputs.action == 'publish'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          set -uo pipefail
          RAW="$RUNNER_TEMP/preflight.log"
          # فرمان از همان ماژولِ آزموده‌شده می‌آید و **percent-encoded** است، چون
          # `@liara/cli@9.5.1` در `lib/commands/app/shell.js:31` فرمان را بدونِ
          # `encodeURIComponent` داخلِ query string می‌گذارد.
          CMD="$(node scripts/deploy/relay-gate.mjs probe-cmd)"
          timeout 150 npx --yes "$LIARA_CLI" shell -a "$APP" \
            --api-token "$LIARA_API_TOKEN" -c "$CMD" > "$RAW" 2>&1
          RC=$?
          echo "::notice::liara shell exit=$RC ($(wc -c < "$RAW") بایت خروجی)"
          node scripts/deploy/relay-gate.mjs preflight "$RAW" "$RC" \
            "{\"phase28Applied\": ${PHASE28_APPLIED}}" >> "$GITHUB_OUTPUT"

      - name: انتشار
        id: publish
        if: steps.gate.outputs.action == 'publish'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # بسته از خودِ SHA بیرون کشیده می‌شود؛ درختِ کاری (و منطقِ دروازه) دست نمی‌خورد.
          PAYLOAD="$RUNNER_TEMP/payload"
          mkdir -p "$PAYLOAD"
          git archive "$SHA" relay | tar -x -C "$PAYLOAD"
          test -f "$PAYLOAD/relay/liara.json"

          # زمانِ **تلاش**، نه زمانِ موفقیت. اگر CLI شکست بخورد این مقدار
          # همچنان وجود دارد — پس گزارش نباید از آن «منتشر شد» بسازد.
          echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          # پیامِ release حاملِ **SHAِ کامل** است — همان‌جا که نسخهٔ مستقر به
          # کامیت گره می‌خورد.
          npx --yes "$LIARA_CLI" deploy \
            --app "$APP" \
            --path "$PAYLOAD/relay" \
            --platform "$PLATFORM" \
            --port "$PORT" \
            --api-token "$LIARA_API_TOKEN" \
            --message "relay @ ${SHA}" \
            --no-app-logs 2>&1 | tee "$RUNNER_TEMP/deploy.log"

          # `@liara/cli@9.5.1` فقط «✔ Release created.» می‌گوید و **هیچ شماره‌ای**
          # چاپ نمی‌کند. تنها شناسه‌ای که واقعاً می‌دهد تگِ ایمیج است، و همان ثبت
          # می‌شود — به‌جای اینکه یک شمارهٔ ساختگی جای release بنشیند.
          REL=$(grep -oE 'apps/[0-9a-f]+:[0-9a-z]+' "$RUNNER_TEMP/deploy.log" | tail -1 || true)
          echo "release=${REL:-بدون-شناسه-در-خروجیِ-CLI}" >> "$GITHUB_OUTPUT"
          # فقط پس از خروجِ موفقِ CLI نوشته می‌شود (`set -e` بالاتر).
          echo "published_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      # `/healthz` فقط می‌گوید یک فرایند روی پورت جواب می‌دهد — نسخهٔ قدیمی هم
      # همین را می‌گوید. پس این گام **زنده‌بودن** است، نه شاهدِ نسخه.
      - name: زنده‌بودن پس از انتشار
        if: always() && steps.publish.outcome == 'success'
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 10 "$HEALTH_URL" || true)" = "ok" ]; then
              echo "::notice::/healthz پس از ${i} تلاش ok شد (زنده‌بودن، نه شاهدِ نسخه)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz تا ۵ دقیقه پس از انتشار ok نشد."
          exit 1

      # ── پذیرش — جدا از انتشار ───────────────────────────────────────────────
      # بازگشت عمداً پذیرش ندارد: نسخهٔ قدیمی کلیدِ `historySections` را منتشر
      # نمی‌کند، پس معیارِ نسخهٔ هدف رویش بی‌معنا است و یک «رد شد»ِ گمراه‌کننده
      # می‌سازد. در گزارش `not-applicable` ثبت می‌شود، نه موفق.
      - name: پذیرش — شاهدِ نسخه از /debug
        id: accept
        if: always() && steps.publish.outcome == 'success' && steps.gate.outputs.code != 'rollback'
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          DEBUG_REACHABLE: ${{ steps.preflight.outputs.debug_reachable }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY_TOKEN:-}" ] || [ "$DEBUG_REACHABLE" != "true" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::شاهدِ نسخه در دسترس نیست (سکرتِ RELAY_TOKEN یا RELAY_TOKEN روی اپ). پذیرش «در انتظار» ثبت شد، نه موفق."
            exit 0
          fi
          BODY=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${RELAY_TOKEN}" "$DEBUG_URL" || true)
          if printf '%s' "$BODY" | node scripts/deploy/relay-gate.mjs accept "{\"phase28Applied\": ${PHASE28_APPLIED}}"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # دفترداری **بعد از** راستی‌آزمایی می‌آید.
      #
      # در اجرای 34955555129 این گام وسط نشسته بود و وقتی شکست، `/healthz` و
      # پذیرش هر دو skipped شدند — یعنی چیزی که همین الان روی Production رفته
      # بود اصلاً بررسی نشد. `always()` هم هست چون «چه چیزی مستقر است» به
      # نتیجهٔ پذیرش ربطی ندارد: انتشار انجام شده، حتی اگر پذیرش رد شود.
      - name: ثبتِ مبنای انتشار
        if: always() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          ACCEPTANCE: ${{ steps.accept.outputs.status }}
        run: |
          set -euo pipefail
          ID=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments" \
                 -d "{\"ref\":\"${SHA}\",\"environment\":\"${BASELINE_ENV}\",\"auto_merge\":false,\"required_contexts\":[],\"description\":\"relay @ ${SHA}\"}" \
               | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                   const d=JSON.parse(s);if(!d.id)throw new Error(d.message||"no deployment id");
                   process.stdout.write(String(d.id));});')
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" \
            -d "{\"state\":\"success\",\"description\":\"acceptance=${ACCEPTANCE:-pending}\"}" > /dev/null
          echo "::notice::مبنای انتشار ثبت شد — deployment $ID روی ${SHA:0:7}"

      - name: گزارش
        if: always()
        env:
          GATE_ACTION: ${{ steps.gate.outputs.action }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          SHA: ${{ steps.sha.outputs.sha }}
          GATE_SHA: ${{ steps.gatesrc.outputs.gate_sha }}
          BASELINE: ${{ steps.gate.outputs.baseline }}
          STARTED_AT: ${{ steps.publish.outputs.started_at }}
          PUBLISHED_AT: ${{ steps.publish.outputs.published_at }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE: ${{ steps.publish.outputs.release }}
          ACCEPTANCE: ${{ steps.accept.outputs.status }}
        run: node scripts/deploy/relay-gate.mjs report >> "$GITHUB_STEP_SUMMARY"
