name: Deploy relay

# ── چرا این فایل وجود دارد ──────────────────────────────────────────────────
# مسیرِ «اتصالِ مستقیمِ مخزن» در کنسولِ لیارا با `"port" is required` رد می‌شود
# (`B-053`). ⚠️ **علتِ ریشه‌ای هنوز تأیید نشده** — لاگِ بیلد خوانده نشده و
# ثابت‌ماندنِ `relay/liara.json` بینِ `6570aaf` و `main` هم آن را اثبات نمی‌کند.
# آنچه این workflow حل می‌کند این است که سه چیزِ ضروریِ انتشار دیگر ضمنی و
# وابسته به حالتِ کنسول نباشند:
#
#   app = arsadata · source = relay/ · port = 3400
#
# ⚠️ دو منتشرکنندهٔ هم‌زمان ممنوع: پیش از فعال‌شدنِ این مسیر، «اتصالِ مخزن» در
# کنسولِ اپ باید قطع شود. جزئیات: docs/RUNBOOK-relay-deploy.md
#
# ── نکتهٔ امنیتیِ ساختار ─────────────────────────────────────────────────────
# منطقِ دروازه‌ها از `scripts/deploy/relay-gate.mjs` **روی شاخهٔ پیش‌فرض** اجرا
# می‌شود، نه از کامیتی که منتشر می‌شود. بستهٔ انتشار با `git archive` در پوشهٔ
# موقت باز می‌شود تا درختِ کاری دست‌نخورده بماند. یعنی کامیتِ مقصد نمی‌تواند
# دروازه‌های خودش را بازنویسی کند.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA برای انتشار (کامل یا حداقل ۷ رقم)"
        required: true
      allow_older:
        description: "بازگشت — اجازهٔ انتشارِ کامیتی قدیمی‌تر از نسخهٔ مستقر (CIِ موفق همچنان لازم است)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # جابه‌جاییِ تگِ relay-deployed = مبنای «چه چیزی مستقر است»
  actions: read     # پرس‌وجوی اجراهای CI برای همان SHA

concurrency:
  group: deploy-relay-arsadata
  cancel-in-progress: false

env:
  LIARA_CLI: "@liara/cli@9.5.1"   # همان نسخه‌ای که نحوِ پرچم‌هایش راستی‌آزمایی شده
  APP: arsadata
  PORT: "3400"
  PLATFORM: node
  BASELINE_TAG: relay-deployed
  HEALTH_URL: "https://arsadata.liara.run/healthz"
  DEBUG_URL: "https://arsadata.liara.run/debug"
  # وضعیتِ واقعیِ Production (۲۰۲۶-۰۹-۱۴): نه `brsapi_budget_days` هست نه
  # `brsapi_budget_lease`. اگر روزی phase28 اجرا شد، این را آگاهانه `true` کن.
  PHASE28_APPLIED: "false"

jobs:
  deploy:
    name: Deploy relay → arsadata
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      # شاخهٔ پیش‌فرض، با کلِ تاریخچه و تگ‌ها — برای محاسبهٔ نسبتِ SHA با main
      # و با مبنای انتشار. `git archive` بعداً بستهٔ مقصد را جدا می‌کند.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: اعتبارسنجی و resolve کردنِ SHA
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RAW="${INPUT_SHA:-}"
          [ "$EVENT" = "workflow_dispatch" ] || RAW="$RUN_SHA"
          # اعتبارسنجی **پیش از** رسیدنِ مقدار به git — وگرنه ورودیِ کاربر
          # مستقیم به خطِ فرمان می‌رسد.
          CLEAN=$(node scripts/deploy/relay-gate.mjs sha "$RAW" | cut -d= -f2)
          FULL=$(git rev-parse --verify "${CLEAN}^{commit}")
          # و خروجیِ git هم اعتبارسنجی می‌شود: باید ۴۰ رقمِ کامل باشد.
          node scripts/deploy/relay-gate.mjs resolved "$FULL" >> "$GITHUB_OUTPUT"

      - name: دروازه — تعلق به تاریخچهٔ main و CIِ موفقِ همان SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
          ALLOW_OLDER: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_older }}
        run: |
          set -euo pipefail
          IN_MAIN=false
          git merge-base --is-ancestor "$SHA" origin/main && IN_MAIN=true || true

          # اجرای موفقِ **CI** روی همان SHA. فیلترِ head_sha به‌تنهایی کافی نیست:
          # workflowهای زمان‌بندی‌شده هم همان head_sha را دارند. پس مستقیم از
          # مسیرِ ci.yml پرسیده می‌شود.
          CI_OK=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{const d=JSON.parse(s);process.stdout.write(String((d.workflow_runs||[]).some(r=>r.conclusion==="success")));}
                catch{process.stdout.write("false");}});')

          BASELINE=null
          OLDER=false
          RELAY_CHANGED=false
          if git rev-parse -q --verify "refs/tags/${BASELINE_TAG}^{commit}" >/dev/null; then
            B=$(git rev-parse "refs/tags/${BASELINE_TAG}^{commit}")
            BASELINE="\"$B\""
            git merge-base --is-ancestor "$SHA" "$B" && OLDER=true || true
            # مبنای مقایسه **آخرین انتشارِ موفق** است، نه HEAD^ — وگرنه در یک
            # pushِ چندکامیتی، تغییرِ relay در کامیتِ ماقبلِ آخر جا می‌ماند.
            git diff --quiet "$B" "$SHA" -- relay/ || RELAY_CHANGED=true
          fi

          node scripts/deploy/relay-gate.mjs decide "{
            \"event\": \"$EVENT\",
            \"sha\": \"$SHA\",
            \"baseline\": $BASELINE,
            \"isAncestorOfMain\": $IN_MAIN,
            \"ciSuccess\": $CI_OK,
            \"isAncestorOfBaseline\": $OLDER,
            \"relayChangedSinceBaseline\": $RELAY_CHANGED,
            \"allowOlder\": ${ALLOW_OLDER:-false}
          }" >> "$GITHUB_OUTPUT"
          echo "baseline=${BASELINE//\"/}" >> "$GITHUB_OUTPUT"

      - name: وجودِ توکن
        if: steps.gate.outputs.action == 'publish'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          if [ -z "${LIARA_API_TOKEN:-}" ]; then
            echo "::error::سکرتِ LIARA_API_TOKEN تنظیم نشده. کنسولِ لیارا → API Token، سپس GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      # ── پیش‌پرواز ───────────────────────────────────────────────────────────
      # **fail-closed، بدونِ راهِ عبور.** اگر پرچم‌ها خوانده نشوند یا ساختارشان
      # درست نباشد، انتشار انجام نمی‌شود. هیچ پرچمی هم تغییر داده نمی‌شود.
      - name: پیش‌پرواز — پرچم‌های واقعیِ اپِ زنده
        id: preflight
        if: steps.gate.outputs.action == 'publish'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          PROBE='const e=process.env;console.log("FLAGS="+JSON.stringify({node:process.version,PORT:e.PORT??null,IR_HISTORY_SECTIONS:e.IR_HISTORY_SECTIONS??null,BRSAPI_CLIENT_ENABLED:e.BRSAPI_CLIENT_ENABLED??null,BRSAPI_BUDGET_ENFORCE_LEGACY:e.BRSAPI_BUDGET_ENFORCE_LEGACY??null,BRSAPI_KEY_SET:Boolean(e.BRSAPI_KEY),SUPABASE_URL_SET:Boolean(e.SUPABASE_URL),SUPABASE_SERVICE_ROLE_KEY_SET:Boolean(e.SUPABASE_SERVICE_ROLE_KEY),RELAY_TOKEN_SET:Boolean(e.RELAY_TOKEN)}))'
          set +e
          OUT=$(timeout 150 npx --yes "$LIARA_CLI" shell -a "$APP" --api-token "$LIARA_API_TOKEN" \
                  -c "node -e '$PROBE'" 2>&1 | tr -d '\r')
          set -e
          # فقط مقدارِ بعد از FLAGS= به ارزیاب می‌رود؛ ساختارش آنجا اعتبارسنجی
          # می‌شود — «پیدا شدنِ FLAGS» به‌تنهایی هیچ تضمینی نیست.
          printf '%s\n' "$OUT" | sed -n 's/^.*FLAGS=//p' | tail -1 \
            | node scripts/deploy/relay-gate.mjs flags "{\"phase28Applied\": ${PHASE28_APPLIED}}" \
            >> "$GITHUB_OUTPUT"

      - name: انتشار
        id: publish
        if: steps.gate.outputs.action == 'publish'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # بسته از خودِ SHA بیرون کشیده می‌شود؛ درختِ کاری (و منطقِ دروازه) دست نمی‌خورد.
          PAYLOAD="$RUNNER_TEMP/payload"
          mkdir -p "$PAYLOAD"
          git archive "$SHA" relay | tar -x -C "$PAYLOAD"
          test -f "$PAYLOAD/relay/liara.json"

          echo "published_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          # پیامِ release حاملِ **SHAِ کامل** است — همان‌جا که نسخهٔ مستقر به
          # کامیت گره می‌خورد.
          npx --yes "$LIARA_CLI" deploy \
            --app "$APP" \
            --path "$PAYLOAD/relay" \
            --platform "$PLATFORM" \
            --port "$PORT" \
            --api-token "$LIARA_API_TOKEN" \
            --message "relay @ ${SHA}" \
            --no-app-logs 2>&1 | tee "$RUNNER_TEMP/deploy.log"

          REL=$(grep -oE '\bv[0-9]+\b' "$RUNNER_TEMP/deploy.log" | tail -1 || true)
          echo "release=${REL:-نامشخص-از-خروجیِ-CLI}" >> "$GITHUB_OUTPUT"

      # مبنا بلافاصله پس از انتشارِ موفق جابه‌جا می‌شود، نه پس از پذیرش:
      # «چه چیزی مستقر است» با «چه چیزی پذیرفته شد» یکی نیست.
      - name: به‌روزرسانیِ مبنای انتشار
        if: steps.publish.outcome == 'success' && steps.gate.outputs.action == 'publish'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "$BASELINE_TAG" "$SHA"
          git push -f origin "refs/tags/${BASELINE_TAG}"

      # `/healthz` فقط می‌گوید یک فرایند روی پورت جواب می‌دهد — نسخهٔ قدیمی هم
      # همین را می‌گوید. پس این گام **زنده‌بودن** است، نه شاهدِ نسخه.
      - name: زنده‌بودن پس از انتشار
        if: steps.gate.outputs.action == 'publish'
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 10 "$HEALTH_URL" || true)" = "ok" ]; then
              echo "::notice::/healthz پس از ${i} تلاش ok شد (زنده‌بودن، نه شاهدِ نسخه)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz تا ۵ دقیقه پس از انتشار ok نشد."
          exit 1

      # ── پذیرش — جدا از انتشار ───────────────────────────────────────────────
      - name: پذیرش — شاهدِ نسخه از /debug
        id: accept
        if: steps.gate.outputs.action == 'publish'
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          DEBUG_REACHABLE: ${{ steps.preflight.outputs.debug_reachable }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY_TOKEN:-}" ] || [ "$DEBUG_REACHABLE" != "true" ]; then
            echo "status=pending" >> "$GITHUB_OUTPUT"
            echo "::warning::شاهدِ نسخه در دسترس نیست (سکرتِ RELAY_TOKEN یا RELAY_TOKEN روی اپ). پذیرش «در انتظار» ثبت شد، نه موفق."
            exit 0
          fi
          BODY=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${RELAY_TOKEN}" "$DEBUG_URL" || true)
          if printf '%s' "$BODY" | node scripts/deploy/relay-gate.mjs accept '{}'; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: گزارش
        if: always()
        env:
          ACTION: ${{ steps.gate.outputs.action }}
          CODE: ${{ steps.gate.outputs.code }}
          REASON: ${{ steps.gate.outputs.reason }}
          SHA: ${{ steps.sha.outputs.sha }}
          BASELINE: ${{ steps.gate.outputs.baseline }}
          RELEASE: ${{ steps.publish.outputs.release }}
          AT: ${{ steps.publish.outputs.published_at }}
          ACCEPT: ${{ steps.accept.outputs.status }}
        run: |
          {
            echo "| مورد | مقدار |"
            echo "|---|---|"
            echo "| تصمیم | \`${ACTION:-—}\` (${CODE:-—}) — ${REASON:-—} |"
            echo "| SHA | \`${SHA:-—}\` |"
            echo "| مبنای قبلی | \`${BASELINE:-—}\` |"
            echo "| **انتشار** | ${AT:+انجام شد در \`$AT\`}${AT:-انجام نشد} |"
            echo "| release | \`${RELEASE:-—}\` |"
            echo "| **پذیرش** | \`${ACCEPT:-در انتظار}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
