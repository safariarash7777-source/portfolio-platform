name: Deploy relay

# ── چرا این فایل وجود دارد ──────────────────────────────────────────────────
# تا امروز رله از راهِ «اتصالِ مستقیمِ مخزن» در کنسولِ لیارا منتشر می‌شد و آن
# مسیر با `"port" is required` شکسته است (`B-053`). علتش داخلِ مخزن نیست:
# `relay/liara.json` از کامیتِ `6570aaf` — همان نسخهٔ موفقِ v46 که همین حالا
# زنده است — تا `main` امروز **بایت‌به‌بایت یکی** است، و `liara.json` در ریشهٔ
# مخزن **هیچ‌وقت وجود نداشته**. پس آن‌چه عوض شده حالتِ سمتِ کنسول است، و هیچ
# ویرایشی در مخزن نمی‌تواند اثبات‌شده درستش کند.
#
# افزودنِ یک `liara.json` به ریشه هم راه‌حل نیست: `scripts.start` ریشه
# `next start` است، پس آن کار «خطا را خاموش می‌کند» و در عوض **اپِ Next.js**
# را به‌جای رله منتشر می‌کند.
#
# این workflow هر سه چیزِ گم‌شده را صریح و نسخه‌دار می‌کند:
#   app = arsadata · source = relay/ · port = 3400
#
# ⚠️ دو منتشرکنندهٔ هم‌زمان ممنوع: پیش از فعال‌شدنِ این مسیر، «اتصالِ مخزن» در
# کنسولِ اپ باید قطع شود. جزئیات: docs/RUNBOOK-relay-deploy.md

on:
  # فقط پس از CI سبز روی همان SHA — نه با هر push.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # انتشارِ دستی و مسیرِ بازگشت (SHA نسخهٔ سالم را بده).
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA برای انتشار (خالی = HEAD شاخهٔ انتخابی). برای بازگشت، SHA نسخهٔ سالم."
        required: false
        default: ""
      flags_checked:
        description: "پرچم‌های اپ را دستی بررسی کرده‌ام؛ اگر پیش‌پرواز نتوانست بخواند ادامه بده"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# هرگز دو انتشارِ هم‌زمان؛ و یک انتشارِ نیمه‌کاره را هم لغو نکن.
concurrency:
  group: deploy-relay-arsadata
  cancel-in-progress: false

env:
  LIARA_CLI: "@liara/cli@9.5.1"   # همان نسخه‌ای که نحوِ پرچم‌هایش راستی‌آزمایی شده
  APP: arsadata
  SOURCE: relay
  PORT: "3400"
  PLATFORM: node
  HEALTH_URL: "https://arsadata.liara.run/healthz"
  DEBUG_URL: "https://arsadata.liara.run/debug"

jobs:
  deploy:
    name: Deploy relay → arsadata
    runs-on: ubuntu-latest
    # اجراهای CI مربوط به PR نباید چیزی منتشر کنند.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    steps:
      # SHA از ورودیِ کاربر می‌آید؛ پیش از هر استفاده‌ای اعتبارسنجی می‌شود تا
      # به تزریقِ فرمان در shell تبدیل نشود.
      - name: تعیینِ SHA
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHA="${INPUT_SHA:-}"
            [ -n "$SHA" ] || SHA="$GITHUB_SHA"
          else
            SHA="$RUN_SHA"
          fi
          case "$SHA" in
            ""|*[!0-9a-fA-F]*) echo "::error::SHA نامعتبر است"; exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%.7s' "$SHA")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 2

      # «استقرارِ بدونِ اختلال» روی این اپ خاموش است، پس هر انتشار یک قطعیِ
      # کوتاه دارد. یعنی انتشارِ رله بابتِ کامیتی که رله را لمس نکرده،
      # قطعیِ بی‌دلیل است.
      - name: آیا relay/ تغییر کرده؟
        id: changed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify 'HEAD^' >/dev/null 2>&1 \
             && ! git diff --name-only 'HEAD^' HEAD | grep -qE '^relay/'; then
            echo "::notice::relay/ در این کامیت تغییر نکرده — انتشار انجام نشد."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.yes == 'true'
        with:
          node-version: "22"

      # مسیرِ workflow_dispatch از CI رد نشده (مثلاً بازگشت به یک SHA قدیمی)،
      # پس بستهٔ واقعیِ انتشار اینجا هم آزموده می‌شود. تست‌های رله وابستگیِ
      # خارجی ندارند، پس به `npm ci` نیازی نیست.
      - name: تست‌های همین بستهٔ انتشار
        if: steps.changed.outputs.yes == 'true'
        run: npm run test:relay

      - name: وجودِ توکن
        if: steps.changed.outputs.yes == 'true'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          if [ -z "${LIARA_API_TOKEN:-}" ]; then
            echo "::error::سکرتِ LIARA_API_TOKEN تنظیم نشده. کنسولِ لیارا → API Token، سپس GitHub → Settings → Secrets and variables → Actions → New repository secret با همین نام."
            exit 1
          fi

      # ── پیش‌پرواز ───────────────────────────────────────────────────────────
      # `phase28` روی Production اجرا **نشده** (بررسیِ کاتالوگ ۲۰۲۶-۰۹-۱۴:
      # نه `brsapi_budget_days` هست نه `brsapi_budget_lease`). کدِ تازه اگر با
      # `BRSAPI_BUDGET_ENFORCE_LEGACY=1` بالا بیاید `BudgetUnavailableError`
      # می‌دهد و «از فرستادنِ بی‌شمارش امتناع» می‌کند — یعنی دادهٔ بازار می‌ایستد.
      # نسخهٔ زندهٔ فعلی (6570aaf) اصلاً این متر را ندارد، پس پرچم امروز بی‌اثر
      # است و **همین انتشار** زنده‌اش می‌کند. پس پیش از انتشار خوانده می‌شود.
      # هیچ مقدارِ سکرتی چاپ نمی‌شود — فقط بود/نبود.
      - name: پیش‌پرواز — مقدارِ واقعیِ پرچم‌ها روی اپِ زنده
        id: preflight
        if: steps.changed.outputs.yes == 'true'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          ALLOW_UNVERIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.flags_checked }}
        run: |
          set -uo pipefail
          PROBE='const e=process.env;console.log("FLAGS="+JSON.stringify({node:process.version,PORT:e.PORT??null,IR_HISTORY_SECTIONS:e.IR_HISTORY_SECTIONS??null,BRSAPI_CLIENT_ENABLED:e.BRSAPI_CLIENT_ENABLED??null,BRSAPI_BUDGET_ENFORCE_LEGACY:e.BRSAPI_BUDGET_ENFORCE_LEGACY??null,BRSAPI_KEY_SET:Boolean(e.BRSAPI_KEY),SUPABASE_URL_SET:Boolean(e.SUPABASE_URL),RELAY_TOKEN_SET:Boolean(e.RELAY_TOKEN)}))'
          OUT=$(timeout 150 npx --yes "$LIARA_CLI" shell -a "$APP" --api-token "$LIARA_API_TOKEN" \
                  -c "node -e '$PROBE'" 2>&1 | tr -d '\r' || true)
          LINE=$(printf '%s\n' "$OUT" | grep -o 'FLAGS={.*}' | tail -1 || true)
          if [ -z "$LINE" ]; then
            echo "::warning::پیش‌پرواز نتوانست پرچم‌ها را از کانتینرِ زنده بخواند."
            if [ "${ALLOW_UNVERIFIED:-false}" = "true" ]; then
              echo "::notice::flags_checked=true — اپراتور دستی بررسی کرده؛ ادامه."
              exit 0
            fi
            echo "::error::انتشار متوقف شد چون وضعیتِ واقعیِ BRSAPI_BUDGET_ENFORCE_LEGACY ناشناخته است. دستور را دستی اجرا کن (RUNBOOK-relay-deploy.md گامِ ۱) و اگر مقدارش «1» نبود، این workflow را با flags_checked=true اجرا کن."
            exit 1
          fi
          echo "$LINE"
          if printf '%s' "$LINE" | grep -q '"BRSAPI_BUDGET_ENFORCE_LEGACY":"1"'; then
            echo "::error::BRSAPI_BUDGET_ENFORCE_LEGACY=1 روی اپ است، ولی phase28 اجرا نشده. انتشارِ این کد رله را به «امتناع از ارسالِ بی‌شمارش» می‌برد و دادهٔ بازار می‌ایستد. یا پرچم را در کنسول بردار یا phase28 را اجرا کن — این workflow پرچم را عوض نمی‌کند."
            exit 1
          fi

      - name: انتشار
        id: publish
        if: steps.changed.outputs.yes == 'true'
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          echo "published_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          npx --yes "$LIARA_CLI" deploy \
            --app "$APP" \
            --path "$SOURCE" \
            --platform "$PLATFORM" \
            --port "$PORT" \
            --api-token "$LIARA_API_TOKEN" \
            --message "relay @ ${SHA_SHORT}" \
            --no-app-logs

      # قطعیِ کوتاه انتظار می‌رود («استقرارِ بدونِ اختلال» خاموش است)، پس
      # تا ۵ دقیقه صبر می‌کنیم — ولی شکستِ پایدار را سبز نمی‌شماریم.
      - name: سلامتِ پس از انتشار
        if: steps.changed.outputs.yes == 'true'
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 10 "$HEALTH_URL" || true)" = "ok" ]; then
              echo "::notice::/healthz پس از ${i} تلاش ok شد."
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz تا ۵ دقیقه پس از انتشار ok نشد. نسخهٔ سالمِ قبلی را با workflow_dispatch و همان SHA دوباره منتشر کن."
          exit 1

      # اثباتِ این‌که کدِ تازه واقعاً بالا آمده، نه فقط پورت باز است.
      # بدونِ سکرتِ RELAY_TOKEN از این گام صرف‌نظر می‌شود (خطا نیست).
      - name: راستی‌آزماییِ کدِ مستقر
        if: steps.changed.outputs.yes == 'true'
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${RELAY_TOKEN:-}" ]; then
            echo "::notice::سکرتِ RELAY_TOKEN تنظیم نشده — /debug بررسی نشد. پذیرش باید دستی انجام شود."
            exit 0
          fi
          BODY=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${RELAY_TOKEN}" "$DEBUG_URL" || true)
          [ -n "$BODY" ] || { echo "::error::/debug پاسخ نداد"; exit 1; }
          printf '%s' "$BODY" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const d=JSON.parse(s);
              console.log("historySections:",JSON.stringify(d.historySections??null));
              console.log("brsapiLegacy.enforced:",d.brsapiLegacy?.enforced??null);
              console.log("brsapiClient.enabled:",d.brsapiClient?.enabled??null);
              if(d.brsapiLegacy?.enforced===true){
                console.error("::error::brsapiLegacy.enforced=true روی نسخهٔ مستقر، ولی phase28 اجرا نشده.");
                process.exit(1);
              }
            });'
